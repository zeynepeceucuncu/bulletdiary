services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: yaprak
      POSTGRES_USER: yaprak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - journal-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaprak -d yaprak"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/yaprak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      YAPRAK_TOKEN: ${YAPRAK_TOKEN:?Set YAPRAK_TOKEN}
volumes:
  journal-db:
